name: Gallery quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:auction-ui:types
      - run: npm run test:auction:local:types
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run test:scripts
      - run: npm run test:fonts
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

  # The browser suite, one project to a runner. On one runner its seven projects took 41 to 57
  # minutes and outgrew the hour a job is given; apart, the longest takes about ten.
  #
  # The browser jobs run in Playwright's own image, which carries the browsers and every system
  # package they need. Installed on the runner, those packages came from Ubuntu's mirror, which
  # on some runners crawled at 20 to 50 kB/s: one install took 41 minutes, and others ran out
  # of their ten. The image's tag must match @playwright/test in package-lock.json; if it does
  # not, the first launch fails and names the browser it cannot find.
  browsers:
    name: browsers (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - firefox-desktop
          - webkit-desktop
          - chromium-mobile
          - webkit-mobile
          - chromium-reduced-motion
          - webkit-reduced-motion
    env:
      # One venue day for the build and the browser suite: its work and its expression.
      COSMIC_VENUE_DATE: '2026-11-06'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The budget spec runs in the budgets job below, alone on its runner.
      - run: npm run test:e2e -- --project=${{ matrix.project }} --grep-invert @budget
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: browsers-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The performance budgets, set in scripts/budgets.json. First the JavaScript each route loads
  # before it can hydrate, read from the production build; then, in Chromium on a desk and a
  # phone, when the art paints and whether anything jumps. Timings need a quiet machine, so the
  # paint is measured on a runner of its own, one page at a time. ARCHITECTURE.md records the
  # baseline each budget was set from.
  budgets:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The browsers' own image, as for the browser suite above.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host --init
    env:
      COSMIC_VENUE_DATE: '2026-11-06'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: build
        run: npm run build
      - run: npm run test:budgets:js
      # Measured even when a script budget failed: the two say different things.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:budgets:paint
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: budgets
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  auction:
    name: auction harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The browsers' own image, as for the browser suite above.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:auction-ui
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: auction-harness
          path: test-results/auction-harness/
          retention-days: 14

  # One check that stands for every job, so a pull request reads green only when all of them
  # passed. It runs even when one failed or was cancelled, and then fails itself.
  verify:
    if: always()
    needs: [checks, browsers, auction, budgets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
